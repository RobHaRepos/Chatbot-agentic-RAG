services:
  logger_service:
    build:
      context: .
      dockerfile: app/logger_service/Dockerfile
    image: "${LOGGER_IMAGE:-chatbot_logger:latest}"
    ports:
      - "8004:8004"
    environment:
      LOGGER_SERVICE_URL: "http://localhost:8004"
      SERVICE_NAME: "logger_service"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 55s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  retriever:
    build:
      context: .
      dockerfile: app/rag/Dockerfile
    image: "${RETRIEVER_IMAGE:-chatbot_retriever:latest}"
    env_file:
      - .env
    ports:
      - "8001:8001"
    environment:
      PATH_TO_FAISS_INDEX: /data/faiss_index
      MODEL_NAME_EMBEDDING: "sentence-transformers/all-MiniLM-L6-v2"
      NUMBER_OF_DOCUMENTS_TO_RETRIEVE: 10
      LOGGER_SERVICE_URL: "http://logger_service:8004"
      SERVICE_NAME: "retriever"
    depends_on:
      - logger_service
    volumes:
      - ./faiss_Hugging_index:/data/faiss_index:ro
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 55s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  llm:
    build:
      context: .
      dockerfile: app/llm/Dockerfile
    image: "${LLM_IMAGE:-chatbot_llm:latest}"
    env_file:
      - .env
    ports:
      - "8002:8002"
    environment:
      MODEL_NAME_LLM: "${MODEL_NAME_LLM:-gpt-4.1-mini}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      MAX_TOKENS: "${MAX_TOKENS:-400}"
      TEMPERATURE_LLM: "${TEMPERATURE_LLM:-0.0}"
      LOGGER_SERVICE_URL: "http://logger_service:8004"
      SERVICE_NAME: "llm"
    depends_on:
      - logger_service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 55s
      timeout: 5s
      retries: 6
    restart: unless-stopped
      
  langgraph:
    build:
      context: .
      dockerfile: app/langgraph_code/Dockerfile
    image: "${LANGGRAPH_IMAGE:-chatbot_langgraph:latest}"
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      LANGGRAPH_RETRIEVER_API_URL: "http://retriever:8001"
      LANGGRAPH_LLM_API_URL: "http://llm:8002"
      LOGGER_SERVICE_URL: "http://logger_service:8004"
      MAX_RETRIEVES: "${MAX_RETRIEVES:-4}"
      SERVICE_NAME: "langgraph"
    depends_on:
      - retriever
      - llm
      - logger_service
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 55s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    image: "${FRONTEND_IMAGE:-chatbot_frontend:latest}"
    ports:
      - "8003:80"
    environment:
      LANGGRAPH_API_URL: "http://localhost:8000/run"
      LOGGER_SERVICE_URL: "http://logger_service:8004"
      SERVICE_NAME: "frontend"
    depends_on:
      - langgraph
      - logger_service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/.well-known/health.json || exit 1"]
      interval: 55s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  hf_cache:
    name: ${HUGGINGFACE_CACHE_VOLUME:-chatbot_hf_cache}

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-chatbot_network}_net

