# SonarQube / SonarCloud project properties
sonar.organization=${{ secrets.SONAR_ORGANIZATION }}
sonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
sonar.proc
sonar.projectName=Chatbot-agentic-RAG
sonar.sourceEncoding=UTF-8
# analyze the application code in the 'app' folder
sonar.sources=app
# exclude tests and large binary/index folders
sonar.exclusions=tests/**,faiss_Hugging_index/**,**/*.pyc
sonar.python.version=3.13
# Point to the coverage report generated by pytest-cov
sonar.python.coverage.reportPaths=coverage.xml
